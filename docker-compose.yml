      context: ./labs/custom-challenges/file-upload-lfi
      dockerfile: Dockerfile
    container_name: ctf-file-upload-lab
    restart: unless-stopped
    ports:
      - "${PORT_CTF_UPLOAD:-9006}:5000"
    environment:
      - FLAG=${FLAG_UPLOAD:-CTF{f1l3_upl04d_lf1_rce_byp4ss_9934}}
    networks:
      - ctf-net
    profiles: ["all", "custom-ctf"]

  ctf-idor-banking:
    build:
      context: ./labs/custom-challenges/idor-banking
      dockerfile: Dockerfile
    container_name: ctf-idor-banking-lab
    restart: unless-stopped
